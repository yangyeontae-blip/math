<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>베리숲 전투 연출 비교</title>
<style>body{margin:0;background:#182b29;color:#f8f1dc;font:16px system-ui;padding:24px}main{max-width:1440px;margin:auto}h1{font-size:25px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:10px 14px;border:1px solid #6f9e8f;background:#28483e;color:inherit;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#e9c986;color:#243d33}.viewer{position:relative;width:100%;aspect-ratio:3/2;background:#294339;overflow:hidden;border-radius:12px}.viewer img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.labels{display:flex;justify-content:space-between;margin:10px 0}input{width:100%;accent-color:#e9c986}a{color:#e9c986}p{line-height:1.6;color:#bed4c7}</style>
<main><h1>베리숲 전투 연출 전후 비교</h1><p>같은 위치에서 시스템 Chrome으로 촬영했습니다. 장면을 고르고 슬라이더를 움직여 비교하세요.</p><nav id="scenes" aria-label="비교할 장면"></nav><div class="labels"><b>변경 전</b><b>변경 후</b></div><div class="viewer"><img id="after" alt="변경 후 전투 화면"><img id="before" alt="변경 전 전투 화면"></div><label>전후 비교 경계 <input id="split" type="range" min="0" max="100" value="50"></label><p><a href="after/low-quality.png">가벼운 화면</a> · <a href="after/reduced-motion.png">움직임 줄이기</a> · <a href="../../docs/combat-visuals.md">구현 기록</a></p></main>
<script>const scenes=[['basic','기본 공격'],['crescent','초승달 베기'],['solarOath','태양의 서약'],['cosmicGenesis','우주의 탄생'],['everbloom','영원의 개화'],['oceanSymphony','별바다 교향곡'],['monsters-zone-0','새싹 구역 몬스터'],['monsters-zone-1','협곡 몬스터'],['monsters-zone-2','달빛 구역 몬스터']];const before=document.querySelector('#before'),after=document.querySelector('#after'),split=document.querySelector('#split');function select(id){before.src='before/'+id+'.png';after.src='after/'+id+'.png';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)))}for(const[id,title]of scenes){const b=document.createElement('button');b.textContent=title;b.dataset.id=id;b.onclick=()=>select(id);document.querySelector('nav').append(b)}function clip(){before.style.clipPath='inset(0 '+(100-split.value)+'% 0 0)'}split.oninput=clip;select('solarOath');clip();</script></html>

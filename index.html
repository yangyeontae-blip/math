  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="베리숲 모험학교">
  <meta property="og:title" content="베리숲 모험학교">
  <meta property="og:description" content="베리를 모으며 1~6학년 수학을 배우는 포근한 3D 숲속 모험">
  <meta property="og:url" content="https://yangyeontae-blip.github.io/math/">
  <meta property="og:image" content="https://yangyeontae-blip.github.io/math/og-image.png">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#cce9d5,#eaf4cf);font-family:'Jua','Gowun Dodum','Noto Sans KR',system-ui,sans-serif;color:#32634d;text-align:center}
    #boot b{display:block;font-size:1.35rem;margin-bottom:10px}
    #boot span{font-size:.88rem}
    #boot button{display:block;margin:22px auto 0;padding:13px 20px;border:0;border-radius:20px;background:#3b8667;color:white;font:inherit;cursor:pointer}
    .boot-berry{font-size:2.7rem;animation:bounce .8s ease-in-out infinite alternate}
    @keyframes bounce{to{transform:translateY(-8px) rotate(8deg)}}
  </style>
</head>
<body><style id="maintenance-style">
#maintenance-notice{position:fixed;z-index:20000;top:12px;left:50%;transform:translateX(-50%);box-sizing:border-box;width:min(620px,calc(100% - 24px));padding:16px 64px 16px 20px;border:1px solid #e3c680;border-radius:16px;background:#fff6d9;color:#604a23;box-shadow:0 6px 24px #46371725;font-family:system-ui,sans-serif;line-height:1.6}
#maintenance-notice strong{font-size:16px}#maintenance-notice p{font-size:13px;margin:4px 0 0}#maintenance-close{position:absolute;right:8px;top:8px;width:48px;height:48px;background:transparent;border:0;font-size:24px;color:#604a23;cursor:pointer}#maintenance-close:focus-visible{outline:3px solid #426b51;border-radius:8px}body:has(#start-screen[hidden]) #maintenance-notice{display:none}
</style><aside id="maintenance-notice" role="status" aria-label="점검 안내"><strong>베리숲 모험학교는 현재 점검 중입니다.</strong><p>더 편하고 즐거운 모험을 위해 마을과 메뉴를 정리하고 있어요.<br>점검 중에는 화면과 기능이 달라질 수 있습니다.</p><button id="maintenance-close" type="button" aria-label="점검 안내 닫기">×</button></aside><script>document.getElementById('maintenance-close').addEventListener('click',function(){document.getElementById('maintenance-notice').remove();});</script>
  <main id="game"><div id="boot"><div><div class="boot-berry">🍓</div><b>베리숲을 준비하고 있어요</b><span>나무와 친구들을 깨우는 중…</span></div></div></main>
  <script>
    (() => {
      let checking = false;
      async function recoverBoot() {
        if (checking || !document.getElementById('boot')) return;
        checking = true;
        const freshUrl = new URL(location.href);
        freshUrl.searchParams.set('fresh', String(Date.now()));
        try {
          const response = await fetch(freshUrl, { cache: 'no-store' });
          if (response.ok) {
            const html = await response.text();
            const latestScript = html.match(/<script[^>]*type="module"[^>]*src="([^"]+)"/i)?.[1];
            const loadedScript = document.querySelector('script[type="module"]')?.getAttribute('src');
            if (latestScript && latestScript !== loadedScript) {
              location.replace(freshUrl.href);
              return;
            }
          }
        } catch (_) { /* Offline or blocked: offer a manual retry. */ }
        const boot = document.getElementById('boot');
        if (!boot) return;
        boot.innerHTML = '<div><div class="boot-berry">🍓</div><b>새 버전을 불러오지 못했어요</b><span>인터넷을 확인한 뒤 다시 시도해 주세요.</span><button id="boot-retry" type="button">다시 불러오기</button></div>';
        document.getElementById('boot-retry')?.addEventListener('click', () => location.replace(freshUrl.href));
      }
      window.addEventListener('error', event => {
        if (event.target instanceof HTMLScriptElement && event.target.type === 'module') recoverBoot();
      }, true);
      setTimeout(recoverBoot, 8000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
